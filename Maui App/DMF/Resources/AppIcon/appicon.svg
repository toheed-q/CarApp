<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#CA2F49" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#CA2F49" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#CA2F49" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark brand tile -->
  <rect x="0" y="0" width="1024" height="1024" fill="#17171A"/>
  <!-- Subtle red glow behind the emblem -->
  <circle cx="512" cy="512" r="420" fill="url(#glow)"/>

  <!-- Two-tone "CD" ring: left half red, right half chrome-white -->
  <g fill="none" stroke-width="76" stroke-linecap="round">
    <path d="M 512 340 A 268 172 0 0 0 512 684" stroke="#CA2F49"/>
    <path d="M 512 340 A 268 172 0 0 1 512 684" stroke="#EAEAEF"/>
  </g>

  <!-- Small red speed accents on the left -->
  <g fill="#CA2F49">
    <path d="M 150 486 L 250 486 L 232 502 L 150 502 Z"/>
    <path d="M 132 512 L 250 512 L 232 528 L 132 528 Z"/>
    <path d="M 150 538 L 250 538 L 232 554 L 150 554 Z"/>
  </g>

  <!-- Car silhouette (side profile) -->
  <path d="M 378 556
           C 378 536 388 526 406 522
           C 420 500 440 492 466 490
           C 482 474 502 466 532 466
           L 560 466
           C 596 466 614 486 626 510
           C 638 516 648 524 650 538
           C 652 546 650 553 642 555
           L 378 556 Z"
        fill="#F2F2F5"/>

  <!-- Red window accent -->
  <path d="M 486 494
           C 498 478 510 472 530 472
           L 548 472
           C 556 472 560 480 557 488
           L 552 494 Z"
        fill="#CA2F49"/>

  <!-- Wheels (arches + red hubs) -->
  <g>
    <circle cx="440" cy="556" r="30" fill="#17171A"/>
    <circle cx="440" cy="556" r="18" fill="#33363F"/>
    <circle cx="440" cy="556" r="7"  fill="#CA2F49"/>

    <circle cx="596" cy="556" r="30" fill="#17171A"/>
    <circle cx="596" cy="556" r="18" fill="#33363F"/>
    <circle cx="596" cy="556" r="7"  fill="#CA2F49"/>
  </g>
</svg>
