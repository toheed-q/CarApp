<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarDeals — Open Listing</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Social share preview -->
    <meta property="og:title" content="CarDeals — Car Listing" />
    <meta property="og:description" content="Check out this car on CarDeals. Tap to open in the app." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0a0c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg: #0a0a0c;
            --card: rgba(24, 26, 34, 0.72);
            --card-border: rgba(255, 255, 255, 0.08);
            --red: #ca2f49;
            --red-2: #e0405b;
            --text: #ffffff;
            --muted: #9a9daa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Ambient brand glows */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 420px; height: 420px;
            background: rgba(202, 47, 73, 0.22);
            top: -140px; right: -120px;
        }
        body::after {
            width: 360px; height: 360px;
            background: rgba(60, 90, 200, 0.14);
            bottom: -160px; left: -120px;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: var(--card);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            padding: 40px 30px 28px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        }

        .logo-img {
            width: 172px;
            max-width: 62%;
            height: auto;
            margin: 0 auto 14px;
            display: block;
            filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.45));
        }

        .wordmark {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 26px;
        }
        .wordmark .c { color: var(--red); }
        .wordmark .d { color: #fff; }

        .spinner {
            width: 32px;
            height: 32px;
            margin: 4px auto 20px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        p.sub { color: var(--muted); font-size: 14px; line-height: 1.55; margin-bottom: 24px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            padding: 15px 18px;
            border-radius: 15px;
            font-family: inherit;
            font-size: 15.5px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: linear-gradient(135deg, var(--red-2), var(--red));
            color: #fff;
            box-shadow: 0 10px 26px rgba(202, 47, 73, 0.38);
        }
        .btn-primary:hover { box-shadow: 0 12px 30px rgba(202, 47, 73, 0.5); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border: 1.5px solid rgba(255, 255, 255, 0.16);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); }

        .btn svg { width: 18px; height: 18px; flex: none; }

        .hidden { display: none; }

        footer {
            margin-top: 24px;
            color: #5f626d;
            font-size: 12px;
            letter-spacing: 0.3px;
        }
        footer .heart { color: var(--red); }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo-img" src="cardeals-logo.png" alt="CarDeals" />
        <div class="wordmark"><span class="c">Car</span><span class="d">Deals</span></div>

        <!-- Auto-redirect view -->
        <div id="loadingView">
            <div class="spinner"></div>
            <h1>Opening listing…</h1>
            <p class="sub">Taking you to the CarDeals app. If nothing happens, use a button below.</p>
        </div>

        <!-- Manual fallback buttons (always available) -->
        <a id="openAppBtn" class="btn btn-primary" href="#">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Open in CarDeals app
        </a>
        <a id="storeBtn" class="btn btn-secondary" href="#">
            <svg viewBox="0 0 24 24" fill="none"><path d="m4 3 13 9-13 9V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            Get the app on Google Play
        </a>

        
    </div>

    <script>
        /* ---------------------------------------------------------------
           CONFIG — the only values you may need to change later.
           - APP_SCHEME  : the app's custom URL scheme (registered in the
                           Android manifest as dmfmotors://car/{id}).
                           NOTE: this is the technical deep-link scheme and
                           must stay "dmfmotors" — it is NOT the brand name.
           - PACKAGE     : the Play Store package name (com.dmf.services).
        --------------------------------------------------------------- */
        var APP_SCHEME = "dmfmotors";
        var PACKAGE = "com.dmf.services";
        var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=" + PACKAGE;

        // 1. Read the car id from the URL (?id=21).
        var params = new URLSearchParams(window.location.search);
        var carId = params.get("id");

        // The deep link the app will handle, e.g. dmfmotors://car/21
        var appLink = carId ? APP_SCHEME + "://car/" + carId : null;

        // 2. Wire up the manual buttons.
        var openAppBtn = document.getElementById("openAppBtn");
        var storeBtn = document.getElementById("storeBtn");
        storeBtn.href = PLAY_STORE_URL;

        if (appLink) {
            openAppBtn.href = appLink;
        } else {
            // No id in the link — just offer the store.
            openAppBtn.classList.add("hidden");
            document.getElementById("loadingView").innerHTML =
                '<h1>Welcome to CarDeals</h1><p class="sub">Buy and sell cars with confidence. Download the app to get started.</p>';
        }

        // 3. Auto-attempt: open the app; if it isn't installed, go to the store.
        if (appLink) {
            var appOpened = false;

            // If the app opens, the browser tab is backgrounded — we detect that
            // and cancel the store fallback so installed users are never redirected.
            function markOpened() { appOpened = true; }
            document.addEventListener("visibilitychange", function () {
                if (document.hidden) markOpened();
            });
            window.addEventListener("blur", markOpened);
            window.addEventListener("pagehide", markOpened);

            // Try to launch the app.
            window.location.href = appLink;

            // Still here after the timeout? App isn't installed → Play Store.
            setTimeout(function () {
                if (!appOpened && !document.hidden) {
                    window.location.href = PLAY_STORE_URL;
                }
            }, 1600);
        }
    </script>
</body>
</html>
